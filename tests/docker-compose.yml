version: '3'

networks:
  raft-1-2-bridge:
    driver: bridge
  raft-1-3-bridge:
    driver: bridge
  raft-2-3-bridge:
    driver: bridge
  raft1-net:
    driver: bridge
  raft2-net:
    driver: bridge
  raft3-net:
    driver: bridge

services:
  raft-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - raft1-net
      - raft-1-2-bridge
      - raft-1-3-bridge
    ports:
      - "8083:8081"
    environment:
      - RAFTIG_NODE_INTERNAL_URI=http://raft-server-1:8081
      - RAFTIG_API_INTERNAL_PORT=8081
      - RAFTIG_PEERS_URIS=http://raft-server-2:8081,http://raft-server-3:8081

  raft-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - raft2-net
      - raft-1-2-bridge
      - raft-2-3-bridge
    ports:
      - "8085:8081"
    environment:
      - RAFTIG_NODE_INTERNAL_URI=http://raft-server-2:8081
      - RAFTIG_API_INTERNAL_PORT=8081
      - RAFTIG_PEERS_URIS=http://raft-server-1:8081,http://raft-server-3:8081

  raft-server-3:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - raft3-net
      - raft-1-3-bridge
      - raft-2-3-bridge
    ports:
      - "8087:8081"
    environment:
      - RAFTIG_NODE_INTERNAL_URI=http://raft-server-3:8081
      - RAFTIG_API_INTERNAL_PORT=8081
      - RAFTIG_PEERS_URIS=http://raft-server-1:8081,http://raft-server-2:8081
